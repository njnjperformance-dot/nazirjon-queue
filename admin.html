<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-Панель - Nazirjon Performance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d0d0d; color: #fff; padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #141414; padding: 15px; border-radius: 12px; border: 1px solid #262626; }
    h1 { font-size: 1.2rem; color: #e60000; text-transform: uppercase; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .nav-btn { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #aaa; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .nav-btn.active { background: #e60000; color: #fff; border-color: #e60000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    .board-column { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
    .board-title { font-size: 1rem; font-weight: bold; color: #e60000; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

    .pending-counter { display: flex; align-items: center; gap: 10px; background: #1f1a00; border: 1px solid #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
    .pending-val { font-size: 1.2rem; font-weight: bold; color: #ffcc00; }
    .btn-small { padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-small:hover { background: #555; }

    .card { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-pos { font-weight: bold; color: #e60000; font-size: 1rem; }
    .card-title { font-weight: bold; font-size: 0.95rem; color: #fff; }
    .card-num { color: #aaa; font-size: 0.82rem; }

    .card-actions { display: flex; gap: 5px; margin-top: 8px; }
    .btn-action { flex: 1; padding: 6px; background: #262626; border: 1px solid #333; color: #fff; font-size: 0.75rem; border-radius: 4px; cursor: pointer; }
    .btn-complete { background: #008040; border-color: #00e676; font-weight: bold; }
    .btn-delete { background: #800000; border-color: #ff3333; }

    .calc-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .calc-inputs input { width: 100%; padding: 6px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 0.8rem; }

    .report-box { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; }
    .report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat-item { background: #111; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #00e676; }
    .stat-lbl { font-size: 0.75rem; color: #888; margin-top: 4px; }

    .report-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; font-size: 0.85rem; }
    .report-row:last-child { border-bottom: none; }

    .btn-clear-all { width: 100%; padding: 10px; background: #2a0000; border: 1px solid #e60000; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <h1>NAZIRJON PERFORMANCE — АДМИН</h1>
  <div style="font-size: 0.8rem; color: #888;" id="clock">00:00:00</div>
</header>

<div class="nav-tabs">
  <button class="nav-btn active" onclick="switchAdminTab('queueTab', this)">🚘 Управление Очередью</button>
  <button class="nav-btn" onclick="switchAdminTab('reportTab', this)">📊 Отчёты и Касса</button>
</div>

<div id="queueTab" class="tab-content active">
  <div class="board-grid">

    <div class="board-column">
      <div class="board-title">
        <span>💉 INJECTOR PRO</span>
        <button class="btn-small" onclick="addFromPending('injector')">+ Из ожидания</button>
      </div>

      <div class="pending-counter">
        <span style="font-size: 0.85rem; color: #aaa; flex-grow: 1;">У ворот (ожидают):</span>
        <button class="btn-small" onclick="updatePending('injector', 'dec')">-</button>
        <span class="pending-val" id="pendingInj">0</span>
        <button class="btn-small" onclick="updatePending('injector', 'inc')">+</button>
      </div>

      <div id="listInjContainer"></div>
    </div>

    <div class="board-column">
      <div class="board-title" style="color: #3399ff;">
        <span>💻 ECU PERFORMANCE</span>
        <button class="btn-small" onclick="addFromPending('ecu')">+ Из ожидания</button>
      </div>

      <div class="pending-counter">
        <span style="font-size: 0.85rem; color: #aaa; flex-grow: 1;">У ворот (ожидают):</span>
        <button class="btn-small" onclick="updatePending('ecu', 'dec')">-</button>
        <span class="pending-val" id="pendingEcu">0</span>
        <button class="btn-small" onclick="updatePending('ecu', 'inc')">+</button>
      </div>

      <div id="listEcuContainer"></div>
    </div>

    <div class="board-column" style="border-color: #00e676;">
      <div class="board-title" style="color: #00e676;">✅ ГОТОВЫЕ К ВЫДАЧЕ</div>
      <div id="listCompletedContainer"></div>
      <button class="btn-clear-all" onclick="clearAll('completed')">Очистить список готовых</button>
    </div>

  </div>
</div>

<div id="reportTab" class="tab-content">
  <div class="board-grid">

    <div class="board-column" style="border-color: #ff9900;">
      <div class="board-title" style="color: #ff9900;">📊 КАССОВЫЙ ОТЧЁТ ЗА СЕГОДНЯ</div>

      <button class="btn-clear-all" style="border-color: #ff9900; color: #ff9900; background: #2a1a00; margin-bottom: 15px;" onclick="closeShift()">🌙 Закрыть смену / Начать новый день</button>

      <div class="report-box">
        <div class="report-stats">
          <div class="stat-item">
            <div class="stat-val" id="repTotal">0 ₸</div>
            <div class="stat-lbl">Общая касса</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: #3399ff;" id="repWork">0 ₸</div>
            <div class="stat-lbl">Услуги</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: #ffcc00;" id="repParts">0 ₸</div>
            <div class="stat-lbl">Запчасти</div>
          </div>
        </div>

        <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: #fff;">Расчёты за сегодня:</div>
        <div id="reportHistory"></div>
      </div>
    </div>

    <div class="board-column" style="border-color: #555;">
      <div class="board-title" style="color: #aaa;">📁 АРХИВ ПРОШЛЫХ СМЕН</div>
      <div id="reportArchive"></div>
    </div>

  </div>
</div>

<script>
  const SERVER_URL = 'https://nazirjon-queue.onrender.com';

  function updateClock() {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString('ru-RU');
  }
  setInterval(updateClock, 1000);
  updateClock();

  function switchAdminTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  }

  async function loadAdminData() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();

      // Ожидание
      document.getElementById('pendingInj').innerText = data.pending ? data.pending.injector : 0;
      document.getElementById('pendingEcu').innerText = data.pending ? data.pending.ecu : 0;

      // Списки
      renderQueueList('listInjContainer', data.list.injector, 'injector');
      renderQueueList('listEcuContainer', data.list.ecu, 'ecu');
      renderCompletedList('listCompletedContainer', data.completed);

      // Отчёт
      renderReport(data.dailyReport);
    } catch (e) {
      console.error('Ошибка загрузки данных:', e);
    }
  }

  function renderQueueList(containerId, list, service) {
    const box = document.getElementById(containerId);
    box.innerHTML = '';

    if (!list || list.length === 0) {
      box.innerHTML = '<div style="color:#666; font-size:0.85rem; text-align:center; padding:15px;">Очередь пуста</div>';
      return;
    }

    list.forEach((item, index) => {
      box.innerHTML += `
        <div class="card">
          <div class="card-header">
            <span class="card-pos">№${item.pos}</span>
            <span class="card-title">${item.brand}</span>
            <span class="card-num">${item.carNum}</span>
          </div>
          <div style="font-size:0.78rem; color:#aaa; margin-bottom:6px;">
            👤 ${item.name || 'Клиент'} | 📞 ${item.phone || '-'} | 🕒 ${item.time}
          </div>

          <div class="calc-inputs">
            <input type="number" id="work_${service}_${index}" placeholder="Услуга (₸)">
            <input type="number" id="parts_${service}_${index}" placeholder="Запчасть (₸)">
          </div>

          <div class="card-actions">
            <button class="btn-action" onclick="moveItem('${service}', ${index}, 'up')">▲</button>
            <button class="btn-action" onclick="moveItem('${service}', ${index}, 'down')">▼</button>
            <button class="btn-action btn-complete" onclick="completeItem('${service}', ${index})">РАССЧИТАТЬ ✅</button>
            <button class="btn-action btn-delete" onclick="deleteItem('${service}', ${index}, 'list')">✕</button>
          </div>
        </div>
      `;
    });
  }

  function renderCompletedList(containerId, completed) {
    const box = document.getElementById(containerId);
    box.innerHTML = '';

    let allComp = [];
    if (completed) {
      if (completed.injector) completed.injector.forEach((item, index) => allComp.push({ ...item, service: 'injector', origIndex: index }));
      if (completed.ecu) completed.ecu.forEach((item, index) => allComp.push({ ...item, service: 'ecu', origIndex: index }));
    }

    if (allComp.length === 0) {
      box.innerHTML = '<div style="color:#666; font-size:0.85rem; text-align:center; padding:15px;">Список пуст</div>';
      return;
    }

    allComp.forEach(item => {
      box.innerHTML += `
        <div class="card" style="border-color:#00e676;">
          <div class="card-header">
            <span class="card-title" style="color:#00e676;">🚘 ${item.brand}</span>
            <span class="card-num">${item.carNum}</span>
          </div>
          <div style="font-size:0.78rem; color:#aaa; margin-bottom:6px;">
            Услуга: ${item.service === 'injector' ? 'INJECTOR' : 'ECU'} | Время: ${item.time}
          </div>
          <button class="btn-action btn-delete" onclick="deleteItem('${item.service}', ${item.origIndex}, 'completed')">Удалить из готовых</button>
        </div>
      `;
    });
  }

  function renderReport(rep) {
    if (!rep) return;

    document.getElementById('repTotal').innerText = `${rep.totalEarned.toLocaleString()} ₸`;
    document.getElementById('repWork').innerText = `${rep.workEarned.toLocaleString()} ₸`;
    document.getElementById('repParts').innerText = `${rep.partsEarned.toLocaleString()} ₸`;

    // 1. Текущие расчеты за день
    const container = document.getElementById('reportHistory');
    container.innerHTML = '';

    if (rep.history && rep.history.length > 0) {
      rep.history.slice().reverse().forEach(h => {
        container.innerHTML += `
          <div class="report-row">
            <div>
              <strong style="color:#fff;">${h.time}</strong> — ${h.brand} <span style="color:#aaa;">(${h.carNum})</span>
              <div style="color:#888; font-size:0.75rem; margin-top:2px;">Услуги: ${h.work.toLocaleString()} ₸ | Запчасти: ${h.parts.toLocaleString()} ₸</div>
            </div>
            <div style="font-weight:bold; color:#00e676; font-size:0.95rem;">${h.total.toLocaleString()} ₸</div>
          </div>
        `;
      });
    } else {
      container.innerHTML = '<div style="color:#666; font-size:0.85rem; text-align:center; padding:15px;">Сегодня расчётов ещё не было</div>';
    }

    // 2. Архив прошлых смен
    const archiveBox = document.getElementById('reportArchive');
    archiveBox.innerHTML = '';

    if (rep.archive && rep.archive.length > 0) {
      rep.archive.forEach(a => {
        archiveBox.innerHTML += `
          <div class="report-row">
            <div>
              <strong style="color:#ff9900;">📅 ${a.date}</strong> — Обслужено: ${a.count} авто
              <div style="color:#888; font-size:0.75rem; margin-top:2px;">Работа: ${a.work.toLocaleString()} ₸ | Запчасти: ${a.parts.toLocaleString()} ₸</div>
            </div>
            <div style="font-weight:bold; color:#00e676; font-size:0.95rem;">${a.total.toLocaleString()} ₸</div>
          </div>
        `;
      });
    } else {
      archiveBox.innerHTML = '<div style="color:#666; font-size:0.85rem; text-align:center; padding:15px;">Архив смен пуст</div>';
    }
  }

  // --- ДЕЙСТВИЯ ---

  async function updatePending(service, action) {
    await fetch(`${SERVER_URL}/api/admin/pending`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, action })
    });
    loadAdminData();
  }

  async function addFromPending(service) {
    await fetch(`${SERVER_URL}/api/admin/add-from-pending`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });
    loadAdminData();
  }

  async function moveItem(service, index, direction) {
    await fetch(`${SERVER_URL}/api/admin/move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, index, direction })
    });
    loadAdminData();
  }

  async function completeItem(service, index) {
    const workAmount = document.getElementById(`work_${service}_${index}`).value;
    const partsAmount = document.getElementById(`parts_${service}_${index}`).value;

    await fetch(`${SERVER_URL}/api/admin/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, index, workAmount, partsAmount })
    });
    loadAdminData();
  }

  async function deleteItem(service, index, type) {
    if (!confirm('Удалить запись?')) return;
    await fetch(`${SERVER_URL}/api/admin/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, index, type })
    });
    loadAdminData();
  }

  async function clearAll(type) {
    if (!confirm('Вы уверены, что хотите очистить весь список?')) return;
    await fetch(`${SERVER_URL}/api/admin/clear-all`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type })
    });
    loadAdminData();
  }

  async function closeShift() {
    if (!confirm('Вы точно хотите закрыть текущую смену и сохранить результат в архив? Счёт за сегодня обнулится.')) return;

    try {
      const res = await fetch(`${SERVER_URL}/api/admin/close-shift`, { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        alert('✅ Смена успешно закрыта и сохранена в архив!');
        loadAdminData();
      }
    } catch (e) {
      alert('Ошибка при закрытии смены');
    }
  }

  setInterval(loadAdminData, 4000);
  loadAdminData();
</script>
</body>
</html>
