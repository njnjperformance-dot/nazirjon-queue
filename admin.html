<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazirjon Performance — Админка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0a0a0a; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }

    h1 { text-align: center; color: #e60000; font-size: 1.4rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #aaa; font-size: 0.8rem; margin-bottom: 15px; }

    /* ВКЛАДКИ */
    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      background: #181818;
      padding: 5px;
      border-radius: 10px;
      border: 1px solid #282828;
    }
    .tab-btn {
      flex: 1;
      padding: 11px;
      background: transparent;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }
    .tab-btn.active {
      background: #e60000;
      color: #fff;
      box-shadow: 0 3px 10px rgba(230, 0, 0, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* БЛОКИ И КАРТОЧКИ */
    .section-box {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .section-title {
      font-size: 1rem;
      font-weight: bold;
      color: #e60000;
      margin-bottom: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .btn-add {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #e60000;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .card {
      background: #1f1f1f;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card-info { flex-grow: 1; }
    .card-title { font-size: 0.95rem; font-weight: bold; color: #fff; }
    .card-sub { font-size: 0.8rem; color: #888; margin-top: 3px; }

    .btn-action {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-ok { background: #00e676; color: #000; }
    .btn-del { background: #ff3333; color: #fff; }

    .btn-clear {
      width: 100%;
      padding: 10px;
      background: #2a0000;
      border: 1px solid #ff3333;
      color: #ff4d4d;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 0.82rem;
    }

    /* КАССА И СЧЁТЧИКИ */
    .grand-total-box {
      background: #002611;
      border: 1px solid #00e676;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
    }
    .grand-val { font-size: 1.4rem; font-weight: bold; color: #00e676; }
    .grand-lbl { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 2px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .stat-card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-val { font-size: 1rem; font-weight: bold; color: #00e676; }
    .stat-lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 2px; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #282828;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Nazirjon Performance</h1>
  <div class="subtitle">Панель управления</div>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('queueTab', this)">🚗 Очередь и Готовые</button>
    <button class="tab-btn" onclick="switchTab('cashTab', this)">📊 Отчёт и Касса</button>
  </div>

  <div id="queueTab" class="tab-content active">

    <div class="section-box">
      <div class="section-title">💉 INJECTOR PRO</div>
      <button class="btn-add" onclick="addYesterday('injector')">➕ Добавить вчерашний / долгий ремонт</button>
      <div id="boxInjector"></div>
    </div>

    <div class="section-box">
      <div class="section-title" style="color: #3399ff;">💻 ECU PERFORMANCE</div>
      <button class="btn-add" onclick="addYesterday('ecu')">➕ Добавить вчерашний / долгий ремонт</button>
      <div id="boxECU"></div>
    </div>

    <div class="section-box" style="border-color: #00e676;">
      <div class="section-title" style="color: #00e676;">✅ ГОТОВЫЕ АВТО (ЖДУТ ВЫДАЧИ)</div>
      <button class="btn-clear" onclick="clearCompleted()">🗑 Очистить все готовые авто</button>
      <div id="boxCompleted"></div>
    </div>

  </div>

  <div id="cashTab" class="tab-content">

    <div class="grand-total-box">
      <div class="grand-val" id="sumGrandTotal">0 ₸</div>
      <div class="grand-lbl">💰 Общая касса за всё время (Текущая + Архив)</div>
      <div style="font-size:0.75rem; color:#00e676; margin-top:4px;">Всего обслужено: <strong id="totalCarsCount">0</strong> авто</div>
    </div>

    <div class="section-box" style="border-color: #ff9900;">
      <div class="section-title" style="color: #ff9900;">📊 КАССА ЗА СЕГОДНЯ</div>

      <button class="btn-clear" style="border-color: #ff9900; color: #ff9900; background: #2a1a00;" onclick="closeShift()">🌙 Закрыть смену / Новый день</button>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val" id="sumTotal">0 ₸</div>
          <div class="stat-lbl">За сегодня</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #3399ff;" id="sumWork">0 ₸</div>
          <div class="stat-lbl">Услуги</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #ffcc00;" id="sumParts">0 ₸</div>
          <div class="stat-lbl">Детали</div>
        </div>
      </div>

      <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 8px;">История за сегодня:</div>
      <div id="boxHistory"></div>
    </div>

    <div class="section-box">
      <div class="section-title" style="color: #aaa;">📁 АРХИВ ПРОШЛЫХ ДНЕЙ</div>
      <div id="boxArchive"></div>
    </div>
  </div>

</div>

<script>
  const SERVER_URL = window.location.origin;

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  async function loadData() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();

      renderList('boxInjector', data.list.injector, 'injector');
      renderList('boxECU', data.list.ecu, 'ecu');
      renderCompleted(data.completed);
      renderCash(data.dailyReport);
    } catch (e) {
      console.error(e);
    }
  }

  function renderList(boxId, list, service) {
    const box = document.getElementById(boxId);
    box.innerHTML = '';

    if (!list || list.length === 0) {
      box.innerHTML = '<div style="color:#666; font-size:0.8rem; text-align:center; padding:10px;">Очередь пуста</div>';
      return;
    }

    list.forEach((item, index) => {
      box.innerHTML += `
        <div class="card">
          <div class="card-info">
            <div class="card-title">№${item.pos} — ${item.brand} <span style="color:#e60000;">(${item.carNum})</span></div>
            <div class="card-sub">👤 ${item.name || 'Клиент'} | 📞 ${item.phone || '-'}</div>
          </div>
          <button class="btn-action btn-ok" onclick="completeCar('${service}', ${index})">🚗 Готово</button>
        </div>
      `;
    });
  }

  function renderCompleted(completed) {
    const box = document.getElementById('boxCompleted');
    box.innerHTML = '';

    let allComp = [];
    if (completed) {
      if (completed.injector) completed.injector.forEach((item, i) => allComp.push({ ...item, service: 'injector', index: i }));
      if (completed.ecu) completed.ecu.forEach((item, i) => allComp.push({ ...item, service: 'ecu', index: i }));
    }

    if (allComp.length === 0) {
      box.innerHTML = '<div style="color:#666; font-size:0.8rem; text-align:center; padding:10px;">Готовых авто нет</div>';
      return;
    }

    allComp.forEach(item => {
      box.innerHTML += `
        <div class="card" style="border-color:#00e676;">
          <div class="card-info">
            <div class="card-title" style="color:#00e676;">🚘 ${item.brand} (${item.carNum})</div>
            <div class="card-sub">Услуга: ${item.service === 'injector' ? 'INJECTOR' : 'ECU'}</div>
          </div>
          <button class="btn-action btn-del" onclick="deleteCar('${item.service}', ${item.index}, 'completed')">✕</button>
        </div>
      `;
    });
  }

  function renderCash(rep) {
    if (!rep) return;

    // Счётчики текущего дня
    document.getElementById('sumTotal').innerText = `${rep.totalEarned.toLocaleString()} ₸`;
    document.getElementById('sumWork').innerText = `${rep.workEarned.toLocaleString()} ₸`;
    document.getElementById('sumParts').innerText = `${rep.partsEarned.toLocaleString()} ₸`;

    // Расчёт общей кассы за всё время (Текущая касса + Архив)
    let archiveTotal = 0;
    let archiveCarsCount = 0;

    if (rep.archive && rep.archive.length > 0) {
      rep.archive.forEach(a => {
        archiveTotal += (a.total || 0);
        archiveCarsCount += (a.count || 0);
      });
    }

    const todayCarsCount = rep.history ? rep.history.length : 0;
    const grandTotal = (rep.totalEarned || 0) + archiveTotal;
    const totalCars = todayCarsCount + archiveCarsCount;

    document.getElementById('sumGrandTotal').innerText = `${grandTotal.toLocaleString()} ₸`;
    document.getElementById('totalCarsCount').innerText = totalCars;

    // История за сегодня
    const boxH = document.getElementById('boxHistory');
    boxH.innerHTML = '';
    if (rep.history && rep.history.length > 0) {
      rep.history.slice().reverse().forEach(h => {
        boxH.innerHTML += `
          <div class="history-item">
            <div>
              <strong>${h.time}</strong> — ${h.brand} (${h.carNum})
              <div style="color:#777; font-size:0.75rem;">Работа: ${h.work}₸ | Детали: ${h.parts}₸</div>
            </div>
            <strong style="color:#00e676;">${h.total.toLocaleString()} ₸</strong>
          </div>
        `;
      });
    } else {
      boxH.innerHTML = '<div style="color:#666; font-size:0.8rem; padding:8px 0;">Расчётов ещё не было</div>';
    }

    // Архив прошлых дней
    const boxA = document.getElementById('boxArchive');
    boxA.innerHTML = '';
    if (rep.archive && rep.archive.length > 0) {
      rep.archive.forEach(a => {
        boxA.innerHTML += `
          <div class="history-item">
            <div>
              <strong style="color:#ff9900;">📅 ${a.date}</strong> (Авто: ${a.count})
              <div style="color:#777; font-size:0.75rem;">Работа: ${a.work}₸ | Запчасти: ${a.parts}₸</div>
            </div>
            <strong style="color:#00e676;">${a.total.toLocaleString()} ₸</strong>
          </div>
        `;
      });
    } else {
      boxA.innerHTML = '<div style="color:#666; font-size:0.8rem; padding:8px 0;">Архив пуст</div>';
    }
  }

  /* ДЕЙСТВИЯ */

  async function completeCar(service, index) {
    const workAmount = prompt('Стоимость работы (₸):', '20000');
    if (workAmount === null) return;

    const partsAmount = prompt('Стоимость запчастей (₸, если нет — 0):', '0');
    if (partsAmount === null) return;

    await fetch(`${SERVER_URL}/api/admin/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, index, workAmount, partsAmount })
    });
    loadData();
  }

  async function addYesterday(service) {
    await fetch(`${SERVER_URL}/api/admin/add-from-pending`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });
    loadData();
  }

  async function deleteCar(service, index, type) {
    if (!confirm('Удалить из списка?')) return;
    await fetch(`${SERVER_URL}/api/admin/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, index, type })
    });
    loadData();
  }

  async function clearCompleted() {
    if (!confirm('Очистить все готовые авто?')) return;
    await fetch(`${SERVER_URL}/api/admin/clear-all`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'completed' })
    });
    loadData();
  }

  async function closeShift() {
    if (!confirm('Закрыть текущую смену и сохранить результат в архив?')) return;
    await fetch(`${SERVER_URL}/api/admin/close-shift`, { method: 'POST' });
    loadData();
  }

  setInterval(loadData, 4000);
  loadData();
</script>
</body>
</html>
