<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель Управления — NAZIRJON</title>
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #141414;
      --accent-red: #e60000;
      --text-white: #ffffff;
      --text-gray: #a0a0a0;
      --border-color: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-white); padding: 20px; }

    h1 { text-align: center; color: var(--accent-red); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }

    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .btn:hover { border-color: var(--text-white); }
    .btn-danger { background: var(--accent-red); border-color: var(--accent-red); }
    .btn-danger:hover { background: #ff1a1a; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .column-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .column-title {
      font-size: 1.2rem;
      font-weight: 800;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--accent-red);
      text-align: center;
      text-transform: uppercase;
    }

    .queue-item {
      background: #0f0f0f;
      border-radius: 6px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--text-white);
    }

    .queue-item.yesterday { border-left-color: var(--accent-red); }

    .car-info .title { font-size: 1rem; font-weight: 700; }
    .car-info .sub { font-size: 0.85rem; color: var(--text-gray); margin-top: 3px; }

    .pos-badge {
      font-size: 1.2rem;
      font-weight: 800;
      background: #1c1c1c;
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .btn-delete {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      margin-left: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>⚙️ Панель Администратора Гаража</h1>

<div class="controls-bar">
  <button class="btn" onclick="addYesterday('injector')">+1 Вчерашняя (Инжектор)</button>
  <button class="btn" onclick="addYesterday('ecu')">+1 Вчерашняя (ЭБУ)</button>
  <button class="btn btn-danger" onclick="clearAll()">Сбросить очередь на сегодня</button>
</div>

<div class="grid-container">
  <div class="column-box">
    <div class="column-title">💉 Инжектор (Управление)</div>
    <div id="adminInjector"></div>
  </div>
  <div class="column-box">
    <div class="column-title">💻 ЭБУ (Управление)</div>
    <div id="adminECU"></div>
  </div>
</div>

<script>
  const SERVER_URL = 'https://nazirjon-queue.onrender.com';

  // Загрузка очереди с сервера
  async function loadQueue() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();
      render(data);
    } catch (e) {
      console.error('Ошибка подключения к серверу:', e);
    }
  }

  // Добавить вчерашнюю машину
  async function addYesterday(service) {
    await fetch(`${SERVER_URL}/api/admin/add-yesterday`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });
    loadQueue();
  }

  // Удалить машину из очереди
  async function removeCar(service, id) {
    await fetch(`${SERVER_URL}/api/admin/remove`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, id })
    });
    loadQueue();
  }

  // Очистить всю очередь
  async function clearAll() {
    if (confirm('Вы уверены, что хотите полностью очистить очередь на сегодня?')) {
      await fetch(`${SERVER_URL}/api/admin/clear`, { method: 'POST' });
      loadQueue();
    }
  }

  // Отрисовка данных на странице
  function render(data) {
    ['injector', 'ecu'].forEach(s => {
      const container = document.getElementById(`admin${s === 'injector' ? 'Injector' : 'ECU'}`);
      container.innerHTML = '';

      // Отображение вчерашних машин
      for (let i = 1; i <= data.pending[s]; i++) {
        container.innerHTML += `
                    <div class="queue-item yesterday">
                        <div class="car-info">
                            <div class="title">Машина с прошлого дня</div>
                            <div class="sub">Перенесена с вчера</div>
                        </div>
                        <span class="pos-badge">№${i}</span>
                    </div>`;
      }

      // Отображение списка зарегистрированных клиентов
      data.list[s].forEach(item => {
        container.innerHTML += `
                    <div class="queue-item">
                        <div class="car-info">
                            <div class="title">${item.brand} (${item.carNum})</div>
                            <div class="sub">Клиент: ${item.name} | Тел: ${item.phone}</div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="pos-badge">№${item.pos}</span>
                            <button class="btn-delete" onclick="removeCar('${s}', ${item.id})">✕</button>
                        </div>
                    </div>`;
      });
    });
  }

  // Автоматическое обновление каждые 3 секунды
  setInterval(loadQueue, 3000);
  loadQueue();
</script>

</body>
</html>
