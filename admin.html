<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazirjon Performance - Панель Администратора</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0a0a0a; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    h1 { text-align: center; color: #e60000; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 1.4rem; }

    /* ВКЛАДКИ */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: #141414;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #262626;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }
    .tab-btn.active {
      background: #e60000;
      color: #fff;
      box-shadow: 0 4px 12px rgba(230, 0, 0, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* КНОПКИ УПРАВЛЕНИЯ */
    .btn-add {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #e60000;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .btn-add:hover { background: #e60000; }

    .btn-reminder {
      width: 100%;
      padding: 12px;
      background: #ff9900;
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .btn-clear-all {
      width: 100%;
      padding: 10px;
      background: #2a0000;
      border: 1px solid #ff3333;
      color: #ff4d4d;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 0.85rem;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .btn-clear-all:hover {
      background: #ff3333;
      color: #fff;
    }

    .board-column {
      background: #141414;
      border: 1px solid #262626;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .board-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      padding-bottom: 10px;
      border-bottom: 2px solid #e60000;
      margin-bottom: 15px;
    }

    .card {
      background: #222;
      border: 1px solid #333;
      margin-top: 10px;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card-yesterday { background: #2a0000; border-color: #ff4d4d; }
    .card-completed { background: #002411; border-color: #00e676; }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn-complete { background: #00e676; color: #000; }
    .btn-delete { background: #ff3333; color: #fff; }

    /* ОТЧЕТЫ */
    .report-box {
      background: #181818;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 12px;
    }
    .report-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      background: #222;
      padding: 15px;
      border-radius: 10px;
    }
    .stat-item { text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #00e676; margin-bottom: 4px; }
    .stat-lbl { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }

    .report-row {
      font-size: 0.88rem;
      padding: 12px 0;
      border-bottom: 1px dashed #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Nazirjon Performance</h1>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('queueTab', this)">🚗 Очередь и Готовые</button>
    <button class="tab-btn" onclick="switchTab('reportTab', this)">📊 Отчёты и Касса</button>
  </div>

  <div id="queueTab" class="tab-content active">

    <button class="btn-reminder" onclick="sendRemindersManual()">📢 Отправить напоминание в WhatsApp (07:00)</button>

    <div class="board-column">
      <div class="board-title">💉 INJECTOR PRO</div>
      <button class="btn-add" onclick="addYesterday('injector')">➕ Добавить долгий/вчерашний ремонт</button>
      <div id="pendingInjectorBox"></div>
      <div id="listInjector"></div>
    </div>

    <div class="board-column">
      <div class="board-title">💻 ECU PERFORMANCE</div>
      <button class="btn-add" onclick="addYesterday('ecu')">➕ Добавить долгий/вчерашний ремонт</button>
      <div id="pendingECUBox"></div>
      <div id="listECU"></div>
    </div>

    <div class="board-column" style="border-color: #00e676;">
      <div class="board-title" style="color: #00e676; border-color: #00e676;">✅ ГОТОВЫЕ АВТО (ОЖИДАЮТ ВЫДАЧИ)</div>
      <button class="btn-clear-all" onclick="clearAllCompleted()">🗑 Удалить ВСЕ готовые машины</button>
      <div id="listCompleted"></div>
    </div>

  </div>

  <div id="reportTab" class="tab-content">
    <div class="board-column" style="border-color: #ff9900;">
      <div class="board-title" style="color: #ff9900; border-color: #ff9900;">📊 КАССОВЫЙ ОТЧЁТ ЗА СЕГОДНЯ</div>

      <div class="report-box">
        <div class="report-stats">
          <div class="stat-item">
            <div class="stat-val" id="repTotal">0 ₸</div>
            <div class="stat-lbl">Общая касса</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: #3399ff;" id="repWork">0 ₸</div>
            <div class="stat-lbl">Услуги</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: #ffcc00;" id="repParts">0 ₸</div>
            <div class="stat-lbl">Запчасти</div>
          </div>
        </div>

        <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; color: #fff;">История расчётов за сегодня:</div>
        <div id="reportHistory"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const SERVER_URL = 'https://nazirjon-queue.onrender.com';

  function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  }

  async function loadAdminData() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();

      renderPendingBox('injector', data.pending.injector);
      renderPendingBox('ecu', data.pending.ecu);

      renderList('Injector', data.list.injector, 'injector');
      renderList('ECU', data.list.ecu, 'ecu');
      renderCompleted(data.completed);
      renderReport(data.dailyReport);
    } catch (e) {
      console.error('Ошибка загрузки данных:', e);
    }
  }

  function renderPendingBox(service, count) {
    const container = document.getElementById(service === 'injector' ? 'pendingInjectorBox' : 'pendingECUBox');
    if (count > 0) {
      container.innerHTML = `
        <div class="card card-yesterday">
          <div>
            <div style="font-weight:bold; color:#ff4d4d;">⚠️ Вчерашние ремонты: ${count}</div>
            <div style="font-size:0.85rem; color:#aaa;">В приоритетном списке</div>
          </div>
          <button class="action-btn btn-complete" onclick="markYesterdayComplete('${service}')">🚗 Готово к выдаче</button>
        </div>
      `;
    } else {
      container.innerHTML = '';
    }
  }

  function renderList(elementId, list, service) {
    const container = document.getElementById(`list${elementId}`);
    container.innerHTML = '';

    if (!list || list.length === 0) {
      container.innerHTML = '<p style="color:#666; text-align:center; padding:10px; font-size:0.9rem;">Нет записанных машин</p>';
      return;
    }

    list.forEach(item => {
      container.innerHTML += `
        <div class="card">
            <div>
                <div style="font-weight:bold; color:#fff;">№${item.pos} - ${item.brand} <span style="color:#e60000;">(${item.carNum})</span></div>
                <div style="font-size:0.85rem; color:#aaa;">Имя: ${item.name} | Тел: ${item.phone}</div>
                <div style="font-size:0.75rem; color:#666;">Запись от: ${item.dateAdded || 'Сегодня'}</div>
            </div>
            <button class="action-btn btn-complete" onclick="markComplete('${service}', '${item.id || item.pos}')">🚗 Готово к выдаче</button>
        </div>
      `;
    });
  }

  function renderCompleted(completedData) {
    const container = document.getElementById('listCompleted');
    container.innerHTML = '';

    let hasCompleted = false;

    if (completedData) {
      ['injector', 'ecu'].forEach(s => {
        if (completedData[s] && completedData[s].length > 0) {
          completedData[s].forEach(item => {
            hasCompleted = true;
            container.innerHTML += `
              <div class="card card-completed">
                  <div>
                      <div style="font-weight:bold; color:#fff;">${item.brand} <span style="color:#00e676;">(${item.carNum})</span></div>
                      <div style="font-size:0.8rem; color:#aaa;">Работа: ${(item.workPrice || 0).toLocaleString()} ₸ | Запчасти: ${(item.partsPrice || 0).toLocaleString()} ₸</div>
                      <div style="font-size:0.9rem; color:#00e676; font-weight:bold; margin-top:2px;">Итого к оплате: ${(item.totalPrice || 0).toLocaleString()} ₸</div>
                  </div>
                  <button class="action-btn btn-delete" onclick="removeCompleted('${s}', '${item.carNum}')">❌ Удалить</button>
              </div>
            `;
          });
        }
      });
    }

    if (!hasCompleted) {
      container.innerHTML = '<p style="color:#666; text-align:center; padding:10px; font-size:0.9rem;">Готовых машин пока нет</p>';
    }
  }

  function renderReport(rep) {
    if (!rep) return;

    document.getElementById('repTotal').innerText = `${rep.totalEarned.toLocaleString()} ₸`;
    document.getElementById('repWork').innerText = `${rep.workEarned.toLocaleString()} ₸`;
    document.getElementById('repParts').innerText = `${rep.partsEarned.toLocaleString()} ₸`;

    const container = document.getElementById('reportHistory');
    container.innerHTML = '';

    if (rep.history && rep.history.length > 0) {
      rep.history.slice().reverse().forEach(h => {
        container.innerHTML += `
          <div class="report-row">
            <div>
              <strong style="color:#fff;">${h.time}</strong> — ${h.brand} <span style="color:#aaa;">(${h.carNum})</span>
              <div style="color:#888; font-size:0.75rem; margin-top:2px;">Услуги: ${h.work.toLocaleString()} ₸ | Детали: ${h.parts.toLocaleString()} ₸</div>
            </div>
            <div style="font-weight:bold; color:#00e676; font-size:0.95rem;">${h.total.toLocaleString()} ₸</div>
          </div>
        `;
      });
    } else {
      container.innerHTML = '<div style="color:#666; font-size:0.85rem; text-align:center; padding:15px;">Сегодня расчётов ещё не было</div>';
    }
  }

  async function markComplete(service, id) {
    const workPrice = prompt('Стоимость работы / услуги (₸):', '20000');
    if (workPrice === null) return;

    const partsPrice = prompt('Стоимость запчасти (₸, если нет — 0):', '5000');
    if (partsPrice === null) return;

    await fetch(`${SERVER_URL}/api/admin/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, id, workPrice, partsPrice })
    });
    loadAdminData();
  }

  async function markYesterdayComplete(service) {
    const workPrice = prompt('Стоимость работы для вчерашней машины (₸):', '20000');
    if (workPrice === null) return;

    const partsPrice = prompt('Стоимость запчасти (₸, если нет — 0):', '5000');
    if (partsPrice === null) return;

    await fetch(`${SERVER_URL}/api/admin/complete-yesterday`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, workPrice, partsPrice })
    });
    loadAdminData();
  }

  async function sendRemindersManual() {
    if (!confirm('Отправить напоминание в WhatsApp всем записанным клиентам?')) return;

    await fetch(`${SERVER_URL}/api/admin/send-reminders`, { method: 'POST' });
    alert('✅ Напоминания отправлены!');
  }

  async function removeCompleted(service, carNum) {
    if (!confirm('Удалить из готовых?')) return;

    await fetch(`${SERVER_URL}/api/admin/remove-completed`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, carNum })
    });
    loadAdminData();
  }

  // Очистить ВСЕ готовые авто
  async function clearAllCompleted() {
    if (!confirm('Вы уверены, что хотите полностью очистить список всех готовых машин?')) return;

    try {
      const res = await fetch(`${SERVER_URL}/api/admin/clear-all-completed`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });

      const data = await res.json();
      if (data.success) {
        loadAdminData();
      } else {
        alert('Ошибка очистки');
      }
    } catch (err) {
      alert('Ошибка подключения к серверу');
    }
  }

  async function addYesterday(service) {
    await fetch(`${SERVER_URL}/api/admin/add-yesterday`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });
    loadAdminData();
  }

  setInterval(loadAdminData, 3000);
  loadAdminData();
</script>
</body>
</html>
