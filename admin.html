<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazirjon ECU - Панель Администратора</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }
    h1 { text-align: center; color: #e60000; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #e60000;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 0.95rem;
      transition: 0.2s;
    }
    .btn-add:hover { background: #e60000; }

    .board-column {
      background: #141414;
      border: 1px solid #262626;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .board-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      padding-bottom: 10px;
      border-bottom: 2px solid #e60000;
      margin-bottom: 15px;
    }

    .card {
      background: #222;
      border: 1px solid #333;
      margin-top: 10px;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card-completed {
      background: #002411;
      border-color: #00e676;
    }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn-complete { background: #00e676; color: #000; }
    .btn-delete { background: #ff3333; color: #fff; }

    .counter { color: #aaa; font-size: 0.9rem; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Nazirjon ECU - Админка</h1>

  <div class="board-column">
    <div class="board-title">💉 INJECTOR PRO</div>
    <button class="btn-add" onclick="addYesterday('injector')">➕ Добавить вчерашнюю машину</button>
    <div class="counter">Вчерашних машин на сегодня: <strong id="pendingInjector" style="color:#e60000;">0</strong></div>
    <div id="listInjector"></div>
  </div>

  <div class="board-column">
    <div class="board-title">💻 ECU PERFORMANCE</div>
    <button class="btn-add" onclick="addYesterday('ecu')">➕ Добавить вчерашнюю машину</button>
    <div class="counter">Вчерашних машин на сегодня: <strong id="pendingECU" style="color:#e60000;">0</strong></div>
    <div id="listECU"></div>
  </div>

  <div class="board-column" style="border-color: #00e676;">
    <div class="board-title" style="color: #00e676; border-color: #00e676;">✅ ГОТОВЫЕ АВТО (ОЖИДАЮТ ВЫДАЧИ)</div>
    <div id="listCompleted"></div>
  </div>
</div>

<script>
  const SERVER_URL = 'https://nazirjon-queue.onrender.com';

  async function loadAdminData() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();

      document.getElementById('pendingInjector').innerText = data.pending.injector;
      document.getElementById('pendingECU').innerText = data.pending.ecu;

      renderList('Injector', data.list.injector, 'injector');
      renderList('ECU', data.list.ecu, 'ecu');
      renderCompleted(data.completed);
    } catch (e) {
      console.error('Ошибка:', e);
    }
  }

  function renderList(elementId, list, service) {
    const container = document.getElementById(`list${elementId}`);
    container.innerHTML = '';

    if (!list || list.length === 0) {
      container.innerHTML = '<p style="color:#666; text-align:center; padding:10px; font-size:0.9rem;">Нет записанных машин</p>';
      return;
    }

    list.forEach(item => {
      container.innerHTML += `
        <div class="card">
            <div>
                <div style="font-weight:bold; color:#fff;">${item.brand} <span style="color:#e60000;">(${item.carNum})</span></div>
                <div style="font-size:0.85rem; color:#aaa;">Имя: ${item.name} | Тел: ${item.phone}</div>
            </div>
            <button class="action-btn btn-complete" onclick="markComplete('${service}', '${item.id || item.pos}')">🚗 Готово к выдаче</button>
        </div>
      `;
    });
  }

  function renderCompleted(completedData) {
    const container = document.getElementById('listCompleted');
    container.innerHTML = '';

    let hasCompleted = false;

    if (completedData) {
      ['injector', 'ecu'].forEach(s => {
        if (completedData[s] && completedData[s].length > 0) {
          completedData[s].forEach(item => {
            hasCompleted = true;
            container.innerHTML += `
              <div class="card card-completed">
                  <div>
                      <div style="font-weight:bold; color:#fff;">${item.brand} <span style="color:#00e676;">(${item.carNum})</span></div>
                      <div style="font-size:0.85rem; color:#aaa;">Услуга: ${s.toUpperCase()}</div>
                      <div style="font-size:0.9rem; color:#00e676; font-weight:bold; margin-top:2px;">К оплате: ${item.price}</div>
                  </div>
                  <button class="action-btn btn-delete" onclick="removeCompleted('${s}', '${item.carNum}')">❌ Удалить</button>
              </div>
            `;
          });
        }
      });
    }

    if (!hasCompleted) {
      container.innerHTML = '<p style="color:#666; text-align:center; padding:10px; font-size:0.9rem;">Готовых машин пока нет</p>';
    }
  }

  async function markComplete(service, id) {
    const price = prompt('Введите стоимость ремонта (в тенге):', '25000');
    if (price === null) return;

    await fetch(`${SERVER_URL}/api/admin/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, id, price })
    });
    loadAdminData();
  }

  async function removeCompleted(service, carNum) {
    if (!confirm('Удалить из готовых?')) return;

    await fetch(`${SERVER_URL}/api/admin/remove-completed`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, carNum })
    });
    loadAdminData();
  }

  async function addYesterday(service) {
    await fetch(`${SERVER_URL}/api/admin/add-yesterday`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });
    loadAdminData();
  }

  setInterval(loadAdminData, 3000);
  loadAdminData();
</script>
</body>
</html>
