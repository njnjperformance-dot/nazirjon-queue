<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка - Nazirjon ECU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d0d0d; color: #fff; padding: 15px; max-width: 700px; margin: 0 auto; }
    .header { text-align: center; color: #e60000; margin-bottom: 20px; text-transform: uppercase; }
    .section-title { font-size: 1.1rem; color: #ff9900; margin: 20px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card-completed { border-color: #00e676; background: #002411; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-green { background: #00e676; color: #000; }
    .btn-red { background: #ff3333; color: #fff; }
    .btn-add { background: #ff9900; color: #000; margin-bottom: 10px; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
  </style>
</head>
<body>

<h2 class="header">Панель Управления</h2>

<button class="btn-add" onclick="addYesterday('injector')">➕ Вчерашняя машина (INJECTOR PRO)</button>
<button class="btn-add" onclick="addYesterday('ecu')">➕ Вчерашняя машина (ECU PERFORMANCE)</button>

<div class="section-title">🔴 АКТИВНАЯ ОЧЕРЕДЬ</div>
<div id="activeQueue"></div>

<div class="section-title" style="color: #00e676;">✅ ГОТОВЫЕ АВТО (ОЖИДАЮТ ВЫДАЧИ)</div>
<div id="completedQueue"></div>

<script>
  const SERVER_URL = 'https://nazirjon-queue.onrender.com';

  async function loadAdminData() {
    try {
      const res = await fetch(`${SERVER_URL}/api/queue`);
      const data = await res.json();
      renderAdmin(data);
    } catch (e) {
      console.error('Ошибка загрузки:', e);
    }
  }

  function renderAdmin(data) {
    const activeContainer = document.getElementById('activeQueue');
    const completedContainer = document.getElementById('completedQueue');

    activeContainer.innerHTML = '';
    completedContainer.innerHTML = '';

    let hasActive = false;
    let hasCompleted = false;

    // 1. Активные машины
    ['injector', 'ecu'].forEach(s => {
      if (data.list && data.list[s]) {
        data.list[s].forEach(item => {
          hasActive = true;
          activeContainer.innerHTML += `
                        <div class="card">
                            <div>
                                <div><strong>[${s.toUpperCase()}] №${item.pos}: ${item.brand}</strong> (${item.carNum})</div>
                                <div style="font-size:0.85rem; color:#aaa;">Имя: ${item.name} | Тел: ${item.phone}</div>
                            </div>
                            <button class="btn btn-green" onclick="markComplete('${s}', '${item.id || item.pos}')">✅ В готовые</button>
                        </div>`;
        });
      }
    });

    if (!hasActive) {
      activeContainer.innerHTML = '<p style="color:#666; padding:10px;">Активных машин нет</p>';
    }

    // 2. Готовые машины
    ['injector', 'ecu'].forEach(s => {
      if (data.completed && data.completed[s]) {
        data.completed[s].forEach(item => {
          hasCompleted = true;
          completedContainer.innerHTML += `
                        <div class="card card-completed">
                            <div>
                                <div style="color:#00e676;"><strong>🏁 [${s.toUpperCase()}] ${item.brand}</strong> (${item.carNum})</div>
                                <div style="font-size:0.85rem; color:#fff;">Сумма: <strong>${item.price}</strong></div>
                                <div style="font-size:0.75rem; color:#aaa;">Завершено: ${item.completedTime || 'Сегодня'}</div>
                            </div>
                            <button class="btn btn-red" onclick="removeCompleted('${s}', '${item.carNum}')">❌ Удалить</button>
                        </div>`;
        });
      }
    });

    if (!hasCompleted) {
      completedContainer.innerHTML = '<p style="color:#666; padding:10px;">Готовых машин нет</p>';
    }
  }

  async function markComplete(service, id) {
    const price = prompt('Введите сумму к оплате за ремонт (в тенге):', '25000');
    if (price === null) return; // Нажали "Отмена"

    await fetch(`${SERVER_URL}/api/admin/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, id, price })
    });

    loadAdminData();
  }

  async function removeCompleted(service, carNum) {
    if (!confirm('Удалить авто из готовых?')) return;

    await fetch(`${SERVER_URL}/api/admin/remove-completed`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service, carNum })
    });

    loadAdminData();
  }

  async function addYesterday(service) {
    await fetch(`${SERVER_URL}/api/admin/add-yesterday`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service })
    });

    loadAdminData();
  }

  setInterval(loadAdminData, 3000);
  loadAdminData();
</script>
</body>
</html>
